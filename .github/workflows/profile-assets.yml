name: Generate profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "22 2 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-assets.yml"
      - "scripts/generate-contribution-pulse.mjs"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  contribution-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution pulse
        run: node scripts/generate-contribution-pulse.mjs
        env:
          GITHUB_USERNAME: aron-76
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          OUTPUT_PATH: dist/contribution-pulse.svg

      - name: Publish generated assets
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "Generate profile assets"
          git push -f "https://x-access-token:${PUBLISH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          PUBLISH_TOKEN: ${{ github.token }}
