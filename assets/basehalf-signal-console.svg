<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Basehalf Signal Console</title>
  <desc id="desc">A dynamic console showing Basehalf maps, points, references, blocks, and AI context.</desc>
  <style>
    :root {
      color-scheme: dark;
    }

    .panel {
      fill: rgba(10, 16, 30, .92);
      stroke: rgba(148, 163, 184, .22);
      stroke-width: 1;
    }

    .grid {
      stroke: rgba(148, 163, 184, .12);
      stroke-width: 1;
    }

    .title {
      fill: #f8fafc;
      font: 800 35px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .01em;
    }

    .subtitle {
      fill: #9fb0c7;
      font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .micro {
      fill: #73849e;
      font: 700 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .label {
      fill: #e5edf8;
      font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .small {
      fill: #94a3b8;
      font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .node {
      fill: rgba(15, 23, 42, .94);
      stroke-width: 1.5;
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .24));
    }

    .folder {
      fill: rgba(15, 23, 42, .92);
      stroke: rgba(125, 211, 252, .38);
      stroke-width: 1.4;
    }

    .folder-tab {
      fill: rgba(14, 165, 233, .2);
      stroke: rgba(125, 211, 252, .34);
      stroke-width: 1;
    }

    .point {
      fill: rgba(17, 24, 39, .94);
      stroke: rgba(52, 211, 153, .42);
      stroke-width: 1.4;
    }

    .block {
      fill: rgba(148, 163, 184, .13);
    }

    .edge {
      stroke: url(#edgeGradient);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 10 16;
      animation: flow 8s linear infinite;
    }

    .edge.thin {
      stroke-width: 1.6;
      opacity: .62;
      animation-duration: 10s;
    }

    .pulse {
      transform-origin: center;
      animation: pulse 4.8s ease-in-out infinite;
    }

    .pulse.delay-1 {
      animation-delay: .8s;
    }

    .pulse.delay-2 {
      animation-delay: 1.6s;
    }

    .scan {
      fill: url(#scanGradient);
      opacity: .36;
      transform: translateX(-240px);
      animation: scan 7s ease-in-out infinite;
    }

    .terminal-line {
      stroke: rgba(20, 184, 166, .5);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-dasharray: 80 420;
      animation: terminal 6s linear infinite;
    }

    .spark {
      fill: #5eead4;
      opacity: .85;
      animation: blink 2.8s ease-in-out infinite;
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -104;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .2;
        transform: scale(.96);
      }
      50% {
        opacity: .48;
        transform: scale(1.07);
      }
    }

    @keyframes scan {
      0%, 100% {
        transform: translateX(-260px);
        opacity: 0;
      }
      18%, 72% {
        opacity: .32;
      }
      88% {
        transform: translateX(1120px);
        opacity: 0;
      }
    }

    @keyframes terminal {
      to {
        stroke-dashoffset: -500;
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: .2;
      }
      50% {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .edge,
      .pulse,
      .scan,
      .terminal-line,
      .spark {
        animation: none;
      }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060b16"/>
      <stop offset=".42" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#09111f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(728 200) rotate(90) scale(220 520)">
      <stop stop-color="#2563eb" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#14b8a6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeGradient" x1="140" y1="210" x2="1040" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset=".48" stop-color="#38bdf8" stop-opacity=".46"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="380" rx="24" fill="url(#glow)"/>

  <g opacity=".9">
    <path class="grid" d="M64 84H1136"/>
    <path class="grid" d="M64 144H1136"/>
    <path class="grid" d="M64 204H1136"/>
    <path class="grid" d="M64 264H1136"/>
    <path class="grid" d="M64 324H1136"/>
    <path class="grid" d="M160 54V368"/>
    <path class="grid" d="M320 54V368"/>
    <path class="grid" d="M480 54V368"/>
    <path class="grid" d="M640 54V368"/>
    <path class="grid" d="M800 54V368"/>
    <path class="grid" d="M960 54V368"/>
  </g>

  <rect class="scan" x="0" y="20" width="220" height="380"/>

  <text x="74" y="72" class="micro">basehalf signal console</text>
  <text x="74" y="112" class="title">Visible context for AI work</text>
  <text x="74" y="140" class="subtitle">folders open into maps, points become memory, references shape what AI can see</text>

  <g>
    <rect class="panel" x="72" y="178" width="238" height="150" rx="18"/>
    <text x="96" y="212" class="micro">map folders</text>
    <rect class="folder-tab" x="96" y="232" width="72" height="20" rx="7"/>
    <rect class="folder" x="96" y="248" width="164" height="52" rx="13"/>
    <rect class="folder-tab" x="128" y="216" width="72" height="20" rx="7" opacity=".7"/>
    <rect class="folder" x="128" y="232" width="164" height="52" rx="13" opacity=".55"/>
    <text x="112" y="284" class="small">Knowledge spaces</text>
  </g>

  <g>
    <rect class="panel" x="390" y="154" width="270" height="198" rx="20"/>
    <text x="420" y="190" class="micro">map canvas</text>
    <rect class="point" x="424" y="218" width="84" height="58" rx="13"/>
    <rect class="point" x="538" y="206" width="84" height="58" rx="13"/>
    <rect class="point" x="510" y="286" width="84" height="44" rx="13"/>
    <path class="edge thin" d="M508 246C528 236 532 232 538 232"/>
    <path class="edge thin" d="M552 264C552 274 552 280 552 286"/>
    <circle class="spark" cx="498" cy="226" r="3"/>
    <circle class="spark" cx="610" cy="216" r="3" style="animation-delay:.8s"/>
    <text x="444" y="253" class="small">Point</text>
    <text x="558" y="241" class="small">Point</text>
    <text x="528" y="313" class="small">Point</text>
  </g>

  <g>
    <rect class="panel" x="742" y="142" width="210" height="220" rx="22"/>
    <text x="772" y="178" class="micro">point document</text>
    <rect class="block" x="772" y="206" width="138" height="16" rx="5"/>
    <rect class="block" x="772" y="236" width="108" height="16" rx="5"/>
    <rect class="block" x="772" y="266" width="148" height="16" rx="5"/>
    <rect class="block" x="772" y="296" width="86" height="16" rx="5"/>
    <circle class="pulse" cx="922" cy="218" r="42" fill="#14b8a6"/>
    <text x="772" y="337" class="small">Blocks become durable memory</text>
  </g>

  <g>
    <circle class="pulse delay-1" cx="1080" cy="252" r="86" fill="#2563eb"/>
    <circle class="pulse delay-2" cx="1080" cy="252" r="58" fill="#14b8a6"/>
    <circle class="node" cx="1080" cy="252" r="66" stroke="#38bdf8"/>
    <text x="1080" y="241" class="micro" text-anchor="middle">ai context</text>
    <text x="1080" y="271" class="label" text-anchor="middle">Composed</text>
  </g>

  <path class="edge" d="M310 252C354 244 356 236 390 230"/>
  <path class="edge" d="M660 248C704 248 704 248 742 248"/>
  <path class="edge" d="M952 252C996 252 1014 252 1014 252"/>

  <path class="terminal-line" d="M74 362H1130"/>
  <text x="74" y="384" class="small">AI output is not the artifact. Structured context is.</text>
</svg>
