<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Basehalf working map</title>
  <desc id="desc">Animated nodes showing ideas becoming context, canvas, editor, AI tools, and product systems.</desc>
  <style>
    :root {
      color-scheme: light dark;
    }

    .bg {
      fill: #0b1020;
    }

    .grid {
      stroke: #26314f;
      stroke-width: 1;
      opacity: .42;
    }

    .link {
      stroke: url(#linkGradient);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 12 18;
      animation: flow 7s linear infinite;
    }

    .node {
      fill: #111827;
      stroke-width: 2;
      filter: drop-shadow(0 16px 26px rgba(0, 0, 0, .22));
    }

    .node-blue {
      stroke: #38bdf8;
    }

    .node-green {
      stroke: #34d399;
    }

    .node-purple {
      stroke: #a78bfa;
    }

    .node-amber {
      stroke: #fbbf24;
    }

    .halo {
      opacity: .16;
      transform-origin: center;
      animation: pulse 4.8s ease-in-out infinite;
    }

    .halo:nth-of-type(2n) {
      animation-delay: 1.1s;
    }

    .label {
      fill: #f8fafc;
      font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-anchor: middle;
    }

    .small {
      fill: #93a4bc;
      font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .08em;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .title {
      fill: #ffffff;
      font: 800 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .subtitle {
      fill: #b6c3d7;
      font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .spark {
      fill: #fbbf24;
      opacity: .9;
      animation: blink 2.8s ease-in-out infinite;
    }

    @keyframes flow {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -120;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: .11;
      }
      50% {
        transform: scale(1.12);
        opacity: .26;
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: .25;
        transform: scale(.92);
      }
      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link, .halo, .spark {
        animation: none;
      }
    }
  </style>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".42" stop-color="#101827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="linkGradient" x1="150" y1="180" x2="1060" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset=".45" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 185) rotate(90) scale(260 620)">
      <stop stop-color="#2563eb" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bgGradient)"/>
  <rect x="18" y="18" width="1164" height="324" rx="22" fill="url(#glow)"/>

  <g opacity=".8">
    <path class="grid" d="M40 80H1160"/>
    <path class="grid" d="M40 140H1160"/>
    <path class="grid" d="M40 200H1160"/>
    <path class="grid" d="M40 260H1160"/>
    <path class="grid" d="M170 42V318"/>
    <path class="grid" d="M340 42V318"/>
    <path class="grid" d="M510 42V318"/>
    <path class="grid" d="M680 42V318"/>
    <path class="grid" d="M850 42V318"/>
    <path class="grid" d="M1020 42V318"/>
  </g>

  <text x="74" y="68" class="title">Basehalf Lab</text>
  <text x="74" y="96" class="subtitle">turning scattered thoughts into navigable product systems</text>

  <path class="link" d="M156 190 C262 98 354 98 460 180"/>
  <path class="link" d="M156 190 C280 246 366 248 492 214"/>
  <path class="link" d="M508 180 C620 118 705 118 816 170"/>
  <path class="link" d="M534 220 C640 268 718 262 824 205"/>
  <path class="link" d="M842 188 C926 138 1008 134 1092 188"/>

  <g>
    <circle class="halo" cx="150" cy="190" r="74" fill="#38bdf8"/>
    <rect class="node node-blue" x="82" y="144" width="136" height="92" rx="22"/>
    <text class="small" x="150" y="178">capture</text>
    <text class="label" x="150" y="207">Ideas</text>
  </g>

  <g>
    <circle class="halo" cx="500" cy="180" r="76" fill="#34d399"/>
    <rect class="node node-green" x="424" y="134" width="152" height="92" rx="22"/>
    <text class="small" x="500" y="168">compose</text>
    <text class="label" x="500" y="197">Context</text>
  </g>

  <g>
    <circle class="halo" cx="500" cy="252" r="58" fill="#fbbf24"/>
    <rect class="node node-amber" x="438" y="226" width="124" height="52" rx="18"/>
    <text class="label" x="500" y="260">Editor</text>
  </g>

  <g>
    <circle class="halo" cx="845" cy="188" r="82" fill="#a78bfa"/>
    <rect class="node node-purple" x="766" y="140" width="158" height="96" rx="24"/>
    <text class="small" x="845" y="175">navigate</text>
    <text class="label" x="845" y="204">Canvas</text>
  </g>

  <g>
    <circle class="halo" cx="1090" cy="188" r="82" fill="#38bdf8"/>
    <rect class="node node-blue" x="1014" y="138" width="152" height="100" rx="24"/>
    <text class="small" x="1090" y="173">orchestrate</text>
    <text class="label" x="1090" y="202">AI Tools</text>
  </g>

  <circle class="spark" cx="692" cy="94" r="5"/>
  <circle class="spark" cx="978" cy="82" r="4" style="animation-delay:.6s"/>
  <circle class="spark" cx="300" cy="292" r="4" style="animation-delay:1.1s"/>
  <circle class="spark" cx="1070" cy="284" r="5" style="animation-delay:1.7s"/>
</svg>
