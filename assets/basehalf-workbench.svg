<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Basehalf workspace interface</title>
  <desc id="desc">A Basehalf-style introduction panel inspired by the app interface.</desc>
  <style>
    :root {
      color-scheme: dark;
    }

    .bg {
      fill: #1a1a17;
    }

    .surface {
      fill: #232320;
      stroke: rgba(255, 255, 255, .08);
      stroke-width: 1;
    }

    .surface-2 {
      fill: #2a2a27;
      stroke: rgba(255, 255, 255, .1);
      stroke-width: 1;
    }

    .surface-3 {
      fill: #343430;
      stroke: rgba(255, 255, 255, .1);
      stroke-width: 1;
    }

    .ghost {
      fill: rgba(255, 255, 255, .04);
      stroke: rgba(255, 255, 255, .07);
      stroke-width: 1;
    }

    .line {
      stroke: rgba(255, 255, 255, .07);
      stroke-width: 1;
    }

    .soft-line {
      stroke: rgba(179, 178, 175, .42);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 4 8;
    }

    .brand {
      fill: #edecea;
      font: 680 78px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .eyebrow {
      fill: #787773;
      font: 650 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .subtitle {
      fill: #b3b2af;
      font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .label {
      fill: #edecea;
      font: 640 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .small {
      fill: #b3b2af;
      font: 520 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .muted {
      fill: #787773;
      font: 520 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .chip-text {
      fill: #d0cfcc;
      font: 600 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .shadow {
      opacity: 1;
    }
  </style>

  <defs>
    <linearGradient id="brandRule" x1="0" y1="0" x2="330" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edecea"/>
      <stop offset=".5" stop-color="#9fa8c5"/>
      <stop offset="1" stop-color="#787773"/>
    </linearGradient>
    <linearGradient id="appGlow" x1="540" y1="26" x2="1110" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="390" rx="28"/>
  <path d="M58 74H1140M58 140H1140M58 206H1140M58 272H1140M58 338H1140" class="line"/>
  <path d="M172 46V344M336 46V344M500 46V344M664 46V344M828 46V344M992 46V344" class="line"/>

  <g transform="translate(70 72)">
    <text class="eyebrow" x="4" y="42">Compound thinking workspace</text>
    <text class="brand" x="0" y="126">Basehalf</text>
    <text class="subtitle" x="4" y="162">Arrange context before the work disappears.</text>
    <rect x="4" y="190" width="330" height="3" rx="1.5" fill="url(#brandRule)"/>

    <g transform="translate(4 220)">
      <rect class="ghost" x="0" y="0" width="72" height="28" rx="14"/>
      <text class="chip-text" x="22" y="18">Maps</text>
      <circle cx="14" cy="14" r="3.5" fill="#9fa8c5"/>

      <rect class="ghost" x="88" y="0" width="78" height="28" rx="14"/>
      <text class="chip-text" x="110" y="18">Points</text>
      <circle cx="102" cy="14" r="3.5" fill="#b3b2af"/>

      <rect class="ghost" x="182" y="0" width="76" height="28" rx="14"/>
      <text class="chip-text" x="204" y="18">Blocks</text>
      <circle cx="196" cy="14" r="3.5" fill="#d0cfcc"/>

      <rect class="ghost" x="274" y="0" width="108" height="28" rx="14"/>
      <text class="chip-text" x="296" y="18">References</text>
      <circle cx="288" cy="14" r="3.5" fill="#8f97b4"/>
    </g>
  </g>

  <g class="shadow" transform="translate(525 48)">
    <rect class="surface" x="0" y="0" width="604" height="294" rx="24"/>
    <rect x="0" y="0" width="604" height="294" rx="24" fill="url(#appGlow)"/>

    <g transform="translate(22 22)">
      <rect class="surface-2" x="0" y="0" width="154" height="250" rx="18"/>
      <rect class="ghost" x="18" y="20" width="118" height="34" rx="10"/>
      <circle cx="38" cy="37" r="7" fill="#8f97b4"/>
      <text class="label" x="54" y="41">Workspace</text>

      <text class="eyebrow" x="18" y="82">Maps</text>
      <rect class="surface-3" x="18" y="98" width="118" height="34" rx="10"/>
      <text class="small" x="34" y="119">Product</text>
      <rect class="ghost" x="18" y="144" width="118" height="34" rx="10"/>
      <text class="small" x="34" y="165">Research</text>
      <rect class="ghost" x="18" y="190" width="118" height="34" rx="10"/>
      <text class="small" x="34" y="211">Launch</text>
    </g>

    <g transform="translate(202 22)">
      <rect class="surface-2" x="0" y="0" width="214" height="250" rx="18"/>
      <text class="eyebrow" x="20" y="32">Canvas</text>
      <path class="soft-line" d="M108 118L58 76"/>
      <path class="soft-line" d="M108 118L160 78"/>
      <path class="soft-line" d="M108 118L66 174"/>
      <path class="soft-line" d="M108 118L158 174"/>

      <rect class="surface-3" x="76" y="88" width="64" height="58" rx="13"/>
      <text class="label" x="91" y="122">Map</text>

      <rect class="ghost" x="30" y="52" width="62" height="44" rx="12"/>
      <text class="small" x="47" y="79">Point</text>

      <rect class="ghost" x="140" y="52" width="44" height="44" rx="12"/>
      <text class="small" x="152" y="79">File</text>

      <rect class="ghost" x="34" y="158" width="72" height="44" rx="12"/>
      <text class="small" x="53" y="185">Spec</text>

      <rect class="ghost" x="132" y="158" width="58" height="44" rx="12"/>
      <text class="small" x="146" y="185">Note</text>
    </g>

    <g transform="translate(442 22)">
      <rect class="surface-2" x="0" y="0" width="140" height="250" rx="18"/>
      <text class="eyebrow" x="20" y="32">Point</text>
      <text class="label" x="20" y="66">Launch notes</text>
      <rect x="20" y="86" width="96" height="7" rx="3.5" fill="#535250"/>
      <rect x="20" y="106" width="72" height="7" rx="3.5" fill="#535250"/>
      <rect x="20" y="126" width="104" height="7" rx="3.5" fill="#535250"/>
      <rect class="ghost" x="20" y="162" width="96" height="30" rx="15"/>
      <text class="chip-text" x="38" y="181">References</text>
      <path d="M20 216H96" stroke="#9fa8c5" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="112" cy="216" r="5" fill="#9fa8c5"/>
    </g>
  </g>
</svg>
